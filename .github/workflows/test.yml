# 每次推送、每个 PR 自动跑测试。不需要书籍（测试用的 EPUB 由测试代码现场构造），不联网调用大模型（用假回答）。
name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（开发镜像：Python + EPUBCheck + chromium）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建开发镜像（与本机 compose.dev.yml 相同）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: epub-typesetter-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 运行 pytest
        run: docker run --rm -v "$PWD:/app" -w /app epub-typesetter-dev:ci pytest -q

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
