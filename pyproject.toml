[project]
name = "epub-typesetter"
version = "0.0.1"
description = "把已有的中文 EPUB 优化为结构规范、排版精良的 EPUB 3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5",
    "tinycss2>=1.3",
    "fonttools[woff]>=4.50",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
