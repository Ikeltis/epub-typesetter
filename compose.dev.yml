# 用法：docker compose -f compose.dev.yml run --rm dev <命令>
name: epub-typesetter-dev
services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: epub-typesetter-dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    working_dir: /app
    ulimits:
      core: 0          # 禁止崩溃转储：曾有 chromium 崩溃把 core 文件写进仓库目录
