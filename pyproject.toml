[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-typesetter"
version = "0.0.1"
description = "缮本：把已有的中文 EPUB 优化为结构规范、排版精良的 EPUB 3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5",
    "cssselect>=1.2",
    "tinycss2>=1.3",
    "fonttools[woff]>=4.50",
    "pillow>=10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "anthropic>=1.17,<2",   # 2.x 默认发 anthropic-version 2026-10-21，sub2api 等中转只认 2023-06-01
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
epub_typesetter = ["themes/*.css", "rules_meta.json"]
